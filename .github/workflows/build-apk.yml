name: Build APK
# Release candidates: push a build/mole-beyond-1.0.N branch and the APK is attached to a DRAFT GitHub
# Release (v1.0.N). Cory approves it by pressing "Publish release". Any other branch can be built on demand from the Actions tab
# ("Run workflow"); those test APKs are attached to the run only, never released.
# The version comes from app.json, so this file doesn't change between versions.
on:
  push:
    branches: ['build/**', 'chet/30-crew-roster-from-33']
    paths-ignore:
      - 'artifacts/**'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Read version from app.json
        run: |
          python - <<'PY'
          import json,os,subprocess
          app=json.load(open('app.json'))['expo']
          ref=os.environ['GITHUB_REF_NAME'];release=ref.startswith('build/')
          # A build branch must match the version inside the app, or it would overwrite another version's release.
          assert not release or ref.endswith('-'+app['version']),f"Branch {ref} doesn't match app.json version {app['version']}: bump the version first"
          sha=subprocess.check_output(['git','rev-parse','--short','HEAD'],text=True).strip()
          name=f"MoleBeyond-{app['version']}-arm64" if release else f"MoleBeyond-{app['version']}-test-{sha}-arm64"
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f"APP_VERSION={app['version']}\nVERSION_CODE={app['android']['versionCode']}\nAPK_NAME={name}\nIS_RELEASE={'true' if release else 'false'}\n")
          print('Building',name,'from',ref)
          # #38: stamp the commit into the app bar so two APKs with the same version can be told apart.
          assert "export const BUILD_SHA: string = 'dev';" in open('src/buildInfo.ts').read(), 'src/buildInfo.ts changed shape'
          open('src/buildInfo.ts','w').write(f"// Stamped by the build workflow (#38).\nexport const BUILD_SHA: string = '{sha}';\n")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Configure Java toolchains and Android SDK
        run: |
          exec > >(tee /tmp/mole-sdk-setup.log) 2>&1
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.java.installations.paths=%s\n' "$JAVA_HOME_17_X64" >> "$HOME/.gradle/gradle.properties"
          python - <<'PYSDK'
          import os,pathlib,urllib.request,xml.etree.ElementTree as ET,hashlib,zipfile,shutil,subprocess,time
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'android-sdk'
          user=pathlib.Path(os.environ['RUNNER_TEMP'])/'android-user'
          user.mkdir(exist_ok=True)
          metadata=ET.fromstring(urllib.request.urlopen('https://dl.google.com/android/repository/repository2-1.xml',timeout=60).read())
          package=next(e for e in metadata if e.tag.endswith('remotePackage') and e.attrib.get('path')=='cmdline-tools;19.0')
          archive=next(e for e in package.findall('./archives/archive') if e.findtext('host-os')=='linux').find('complete')
          filename=archive.findtext('url');expected=archive.findtext('checksum').strip().lower()
          download=pathlib.Path(os.environ['RUNNER_TEMP'])/'android-command-tools.zip'
          with urllib.request.urlopen('https://dl.google.com/android/repository/'+filename,timeout=120) as response,download.open('wb') as out:
              shutil.copyfileobj(response,out)
          digest=hashlib.new('sha1' if len(expected)==40 else 'sha256',download.read_bytes()).hexdigest()
          assert digest==expected,'Official Android tools checksum mismatch'
          target=root/'cmdline-tools';target.mkdir(parents=True)
          with zipfile.ZipFile(download) as z:
              assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist())
              z.extractall(target)
          (target/'cmdline-tools').rename(target/'latest')
          for executable in (target/'latest/bin').iterdir():executable.chmod(0o755)
          manager=target/'latest/bin/sdkmanager'
          env={**os.environ,'ANDROID_HOME':str(root),'ANDROID_SDK_ROOT':str(root),'ANDROID_USER_HOME':str(user)}
          subprocess.run([str(manager),'--sdk_root='+str(root),'--licenses'],input='y\n'*100,text=True,env=env,check=True)
          packages=[str(manager),'--sdk_root='+str(root),'platforms;android-36','build-tools;36.0.0','ndk;27.1.12297006','cmake;3.22.1']
          for attempt in range(3):
              result=subprocess.run(packages,input='y\n'*100,text=True,env=env)
              if result.returncode==0:break
              if attempt==2:raise subprocess.CalledProcessError(result.returncode,packages)
              print('Retrying interrupted Android package download',flush=True);time.sleep(5*(attempt+1))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'ANDROID_HOME={root}\nANDROID_SDK_ROOT={root}\nANDROID_USER_HOME={user}\n')
          PYSDK
      - run: npm ci --no-audit --no-fund
      - name: Run regression and asset checks
        run: |
          npm run typecheck
          # Regenerate offline bundle on Linux runner before verification.
          npm run bundle:hybrid
          npm test
      - name: Generate Android project from the preserved latest game
        run: npx --no-install expo prebuild --platform android --no-install
      - name: Compile installable ARM64 release
        run: |
          set -o pipefail
          cd android
          bash gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs='-Xmx3072m -XX:MaxMetaspaceSize=768m' --console=plain 2>&1 | tee ../apk-build.log
      - name: Show the Gradle error
        if: failure()
        run: |
          if [ -f apk-build.log ]; then grep -nE "error:|FAILURE|What went wrong|Could not|e: " apk-build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done; tail -40 apk-build.log; fi
      - name: Verify APK and prepare download
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/$APK_NAME.apk || { echo "::error::release APK not found: $(ls android/app/build/outputs/apk/release/ 2>&1 | tr '\n' ' ')"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/$APK_NAME.apk > artifacts/APK-VERIFICATION.txt || { echo "::error::apksigner verify failed"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging artifacts/$APK_NAME.apk > artifacts/APK-METADATA.txt 2>/tmp/aapt.txt || { echo "::error::aapt2 dump badging failed: $(head -3 /tmp/aapt.txt | tr '\n' ' ')"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 artifacts/$APK_NAME.apk > /tmp/zipalign.txt 2>&1 || { echo "::error::zipalign 16 KB page-alignment check failed: $(grep -iv 'OK' /tmp/zipalign.txt | head -5 | tr '\n' ' ')"; exit 1; }
          python - <<'PY'
          import pathlib,hashlib,json,os,zipfile,sys
          def fail(msg):
              print('::error::'+msg);sys.exit(1)
          v,code,name=os.environ['APP_VERSION'],os.environ['VERSION_CODE'],os.environ['APK_NAME']
          p=pathlib.Path(f'artifacts/{name}.apk')
          if p.stat().st_size>=100*1024*1024:fail('APK exceeds GitHub per-file download limit')
          metadata=pathlib.Path('artifacts/APK-METADATA.txt').read_text()
          for s in ["name='com.molious.molebeyondtest'",f"versionName='{v}'",f"versionCode='{code}'","native-code: 'arm64-v8a'"]:
              if s not in metadata:fail('APK metadata missing '+s)
          source=pathlib.Path('src/hybridHtml.ts').read_text()
          html=json.loads(source.removeprefix('export default ').strip().removesuffix(';'))
          with zipfile.ZipFile(p) as z:
              if z.testzip() is not None:fail('APK zip is corrupt')
              bundle=z.read('assets/index.android.bundle')
              if not(html.encode() in bundle or html.encode('utf-16-le') in bundle):fail('Latest game document missing from compiled APK')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          pathlib.Path(f'artifacts/{name}.apk.sha256').write_text(digest+'  '+p.name+'\n')
          pathlib.Path(f'artifacts/build-{v}-status.json').write_text(json.dumps({'state':'success','version':v,'version_code':int(code),'release':os.environ['IS_RELEASE']=='true','apk':p.name,'sha256':digest,'bytes':p.stat().st_size,'source_commit':os.environ['GITHUB_SHA'],'signing':'template debug/test key','physical_device_tested':False,'run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          # Only this build's files; artifacts/ also holds APKs committed by older builds.
          path: |
            artifacts/${{ env.APK_NAME }}.apk
            artifacts/${{ env.APK_NAME }}.apk.sha256
            artifacts/APK-VERIFICATION.txt
            artifacts/APK-METADATA.txt
            artifacts/build-${{ env.APP_VERSION }}-status.json
          if-no-files-found: error
      - name: Prepare draft Release for Cory's approval (build branches only)
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # The workflow only ever makes a DRAFT release. Drafts are visible to repo owners only; the APK is not
        # released until Cory presses "Publish release" on GitHub. A version Cory has already published is
        # never overwritten: bump the version instead.
        run: |
          tag="v$APP_VERSION"
          files="artifacts/$APK_NAME.apk artifacts/$APK_NAME.apk.sha256 artifacts/APK-VERIFICATION.txt artifacts/build-$APP_VERSION-status.json"
          notes="DRAFT for Cory's approval. Mole Beyond $APP_VERSION (versionCode $VERSION_CODE) from \`$GITHUB_REF_NAME\` at $GITHUB_SHA. Test build signed with the template key; not yet field tested. Build log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::$tag is already published by Cory. Bump the version in app.json and build a new branch."; exit 1
            fi
            gh release upload "$tag" $files --clobber
            # Keep the draft pointing at this build, so publishing tags the code the APK came from.
            gh release edit "$tag" --notes "$notes (rebuilt)" --target "$GITHUB_SHA"
          else
            gh release create "$tag" $files --target "$GITHUB_SHA" --title "Mole Beyond $APP_VERSION" --notes "$notes" --draft --prerelease
          fi

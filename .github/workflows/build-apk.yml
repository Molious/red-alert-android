name: Build APK
on:
  push:
    branches: [main, build/mole-beyond-1.0.13]
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      BUILD_BRANCH: build/mole-beyond-1.0.13
    steps:
      - uses: actions/checkout@v4
      - name: Publish build-start reference
        if: github.ref_name == 'build/mole-beyond-1.0.13'
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json,os,pathlib
          pathlib.Path('artifacts/build-1.0.13-status.json').write_text(json.dumps({'state':'running','version':'1.0.13','source_commit':os.environ['GITHUB_SHA'],'run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/build-1.0.13-status.json
          git commit -m 'Record Android APK build start [skip ci]'
          git push origin HEAD:refs/heads/$BUILD_BRANCH
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Configure Java toolchains and Android SDK
        run: |
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.java.installations.paths=%s\n' "$JAVA_HOME_17_X64" >> "$HOME/.gradle/gradle.properties"
          python - <<'PY'
          import subprocess
          subprocess.run(['sdkmanager','--licenses'],input='y\n'*100,text=True,check=True)
          subprocess.run(['sdkmanager','platforms;android-36','build-tools;36.0.0','ndk;27.1.12297006','cmake;3.22.1'],check=True)
          PY
      - run: npm ci --no-audit --no-fund
      - name: Run regression and asset checks
        run: |
          npm run typecheck
          npm test
      - name: Generate Android project from the preserved latest game
        run: npx --no-install expo prebuild --platform android --no-install
      - name: Compile installable ARM64 release
        run: |
          cd android
          bash gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs='-Xmx3072m -XX:MaxMetaspaceSize=768m' --console=plain 2>&1 | tee ../apk-build.log
      - name: Verify APK and prepare download
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/MoleBeyond-1.0.13-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/MoleBeyond-1.0.13-arm64.apk > artifacts/APK-VERIFICATION.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifacts/MoleBeyond-1.0.13-arm64.apk > artifacts/APK-METADATA.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 artifacts/MoleBeyond-1.0.13-arm64.apk
          python - <<'PY'
          import pathlib,hashlib,json,os,zipfile
          p=pathlib.Path('artifacts/MoleBeyond-1.0.13-arm64.apk')
          assert p.stat().st_size<100*1024*1024,'APK exceeds GitHub per-file download limit'
          metadata=pathlib.Path('artifacts/APK-METADATA.txt').read_text()
          for s in ["name='com.molious.molebeyondtest'","versionName='1.0.13'","versionCode='14'","native-code: 'arm64-v8a'"]:
              assert s in metadata,s
          source=pathlib.Path('src/hybridHtml.ts').read_text()
          html=json.loads(source.removeprefix('export default ').strip().removesuffix(';'))
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              bundle=z.read('assets/index.android.bundle')
              assert html.encode() in bundle or html.encode('utf-16-le') in bundle,'Latest game document missing from compiled APK'
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          pathlib.Path('artifacts/MoleBeyond-1.0.13-arm64.apk.sha256').write_text(digest+'  '+p.name+'\n')
          pathlib.Path('artifacts/build-1.0.13-status.json').write_text(json.dumps({'state':'success','version':'1.0.13','version_code':14,'apk':p.name,'sha256':digest,'bytes':p.stat().st_size,'source_commit':os.environ['GITHUB_SHA'],'signing':'template debug/test key','physical_device_tested':False,'run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MoleBeyond-1.0.13-arm64
          path: artifacts/
          if-no-files-found: error
      - name: Publish verified APK on the build branch
        if: github.ref_name == 'build/mole-beyond-1.0.13'
        run: |
          git add artifacts/
          git commit -m 'Publish verified Mole Beyond 1.0.13 APK [skip ci]'
          git push origin HEAD:refs/heads/$BUILD_BRANCH
      - name: Publish failure reference
        if: failure() && github.ref_name == 'build/mole-beyond-1.0.13'
        run: |
          python - <<'PY'
          import json,os,pathlib
          pathlib.Path('artifacts').mkdir(exist_ok=True)
          pathlib.Path('artifacts/build-1.0.13-status.json').write_text(json.dumps({'state':'failed','version':'1.0.13','run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"},indent=2)+'\n')
          PY
          git add artifacts/build-1.0.13-status.json
          git commit -m 'Record Android build failure [skip ci]'
          git push origin HEAD:refs/heads/$BUILD_BRANCH
